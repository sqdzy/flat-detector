name: Python tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flat_detector_ci
          POSTGRES_USER: flat_detector
          POSTGRES_PASSWORD: local_ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flat_detector -d flat_detector_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      FD_PG_INTEGRATION_DSN: postgresql+psycopg://flat_detector:local_ci_only_password@127.0.0.1:5432/flat_detector_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install project dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit, MCP SDK and PostgreSQL integration tests
        run: python -m pytest -q --cov=flat_detector --cov-report=term-missing
      - name: Validate Docker Compose configuration (no containers started)
        run: |
          mkdir -p deploy/secrets
          printf 'ci-example-only\n' > deploy/secrets/postgres_password_app
          printf 'ci-example-only\n' > deploy/secrets/postgres_password_db
          printf 'ci-example-only\n' > deploy/secrets/telegram_token
          docker compose --profile telegram --profile mcp --profile approved_feed config --quiet
          docker compose --profile telegram --profile mcp --profile approved_feed config --format json | python -c 'import json,sys; services=json.load(sys.stdin)["services"]; names=("web","migrate","bot","scheduler","sender","mcp","approved_feed"); images={services[n]["image"] for n in names}; assert images == {"flat-detector-app:staging"}, images'
      - name: Docker image, Alembic migration and loopback API smoke
        run: |
          set -euo pipefail
          # Uses only dummy CI secrets created by the previous Compose validation step.
          docker compose build web
          docker compose up -d --no-build --wait db
          docker compose up -d --no-deps --no-build --force-recreate migrate
          CID="$(docker compose ps -a -q migrate)"
          test -n "$CID"
          EXIT_CODE="$(docker wait "$CID")"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "Migration failed, exit code: $EXIT_CODE"
            docker compose logs --tail=60 migrate
            exit 1
          fi
          docker compose up -d --no-build web
          for attempt in $(seq 1 24); do
            if curl --fail --silent http://127.0.0.1:8005/health/live >/dev/null && \
               curl --fail --silent http://127.0.0.1:8005/health/ready >/dev/null; then
              echo "Dockerized migration and both health endpoints passed"
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=60 migrate web
          exit 1
      - name: Compile
        run: python -m compileall -q flat_detector
